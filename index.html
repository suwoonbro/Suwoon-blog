<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수운 守韻 Suwoon</title>
    <meta name="description" content="제너럴리스트, 탐구를 지속함.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-ink: #1a1a1a;
            --color-ink-light: #6b6b6b;
            --color-ink-faint: #a0a0a0;
            --color-paper: #fafaf8;
            --color-rule: #e0ddd8;
            --font-serif: 'Newsreader', 'Noto Serif KR', Georgia, serif;
            --max-width: 640px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 17px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-serif);
            color: var(--color-ink);
            background: var(--color-paper);
            line-height: 1.7;
            min-height: 100vh;
        }

        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        header {
            padding: 4rem 0 3rem;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.1s forwards;
        }

        .site-name {
            font-size: 1.6rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            margin-bottom: 1.2rem;
            color: var(--color-ink);
        }

        .site-name a {
            text-decoration: none;
            color: inherit;
        }

        .site-name .roman {
            font-weight: 300;
            color: var(--color-ink-faint);
            font-size: 0.88em;
            letter-spacing: 0.04em;
        }

        .bio {
            font-size: 1.05rem;
            font-weight: 300;
            color: var(--color-ink-light);
            line-height: 1.8;
            max-width: 520px;
        }

        .bio p { margin: 0; }

        nav {
            padding: 1.5rem 0;
            border-top: 1px solid var(--color-rule);
            border-bottom: 1px solid var(--color-rule);
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.25s forwards;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
        }

        nav a {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--color-ink-light);
            text-decoration: none;
            letter-spacing: 0.03em;
            transition: color 0.2s ease;
        }

        nav a:hover, nav a.active { color: var(--color-ink); }

        section { padding: 3rem 0; }

        .section-title {
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--color-ink-faint);
            margin-bottom: 2rem;
        }

        .writing-list {
            list-style: none;
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.4s forwards;
        }

        .writing-item {
            padding: 1.4rem 0;
            border-bottom: 1px solid var(--color-rule);
            transition: transform 0.2s ease;
        }

        .writing-item:first-child { border-top: none; }
        .writing-item:hover { transform: translateX(4px); }

        .writing-item a {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .writing-title {
            font-size: 1.1rem;
            font-weight: 400;
            line-height: 1.5;
            margin-bottom: 0.3rem;
            color: var(--color-ink);
        }

        .writing-meta {
            font-size: 0.82rem;
            color: var(--color-ink-faint);
            font-weight: 300;
        }

        .about-lines {
            font-size: 1.05rem;
            font-weight: 300;
            color: var(--color-ink-light);
            line-height: 1.8;
        }

        .about-lines p { margin: 0; }
        .about-lines p + p { margin-top: 0.3rem; }

        .empty-state {
            font-size: 0.95rem;
            font-weight: 300;
            color: var(--color-ink-faint);
            font-style: italic;
        }

        footer {
            padding: 3rem 0 4rem;
            border-top: 1px solid var(--color-rule);
            opacity: 0;
            animation: fadeIn 0.8s ease-out 0.7s forwards;
        }

        .footer-links {
            display: flex;
            gap: 1.8rem;
            flex-wrap: wrap;
        }

        .footer-links a {
            font-size: 0.85rem;
            color: var(--color-ink-faint);
            text-decoration: none;
            letter-spacing: 0.02em;
            transition: color 0.2s ease;
        }

        .footer-links a:hover { color: var(--color-ink); }

        .copyright {
            margin-top: 1.5rem;
            font-size: 0.78rem;
            color: var(--color-ink-faint);
            font-weight: 300;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            html { font-size: 16px; }
            header { padding: 3rem 0 2rem; }
            nav ul { gap: 1.5rem; }
            section { padding: 2.5rem 0; }
        }

        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="site-name"><a href="#" onclick="showPage('home')">수운 <span class="roman">Suwoon</span></a></h1>
            <div class="bio">
                <p>제너럴리스트, 탐구를 지속함.</p>
            </div>
        </header>

        <nav>
            <ul>
                <li><a href="#" class="active" onclick="showPage('home')" id="nav-home">글</a></li>
                <li><a href="#" onclick="showPage('about')" id="nav-about">소개</a></li>
            </ul>
        </nav>

        <div class="page active" id="page-home">
            <section>
                <p class="section-title">Writing</p>
                <ul class="writing-list">
                    <!-- 글을 추가하려면 아래 형식을 복사하세요:
                    <li class="writing-item">
                        <a href="#">
                            <div class="writing-title">글 제목</div>
                            <div class="writing-meta">2026년 4월</div>
                        </a>
                    </li>
                    -->
                </ul>
                <p class="empty-state">아직 글이 없습니다.</p>
            </section>
        </div>

        <div class="page" id="page-about">
            <section>
                <p class="section-title">About</p>
                <div class="about-lines">
                    <p>#BTC #AI #Med</p>
                </div>
            </section>
        </div>

        <footer>
            <div class="footer-links">
                <a href="https://github.com/suwoon" target="_blank" rel="noopener">GitHub</a>
                <a href="https://x.com/suwoon" target="_blank" rel="noopener">X</a>
                <a href="mailto:hello@suwoon.com">hello@suwoon.com</a>
            </div>
            <p class="copyright">&copy; 2026 수운</p>
        </footer>
    </div>

    <script>
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
            document.getElementById('nav-' + pageId).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
